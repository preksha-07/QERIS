version: '3.8'

services:
  qeris-cloud:
    build: .
    container_name: qeris-cloud
    command: python -m uvicorn qeris.s2.cloud_service:app --host 0.0.0.0 --port 8001 --ssl-certfile=/app/qeris/s2/certs/cloud_cert.pem --ssl-keyfile=/app/qeris/s2/certs/cloud_key.pem
    ports:
      - "8001:8001"
    environment:
      - QERIS_ADMIN_API_KEY=${QERIS_ADMIN_API_KEY}
    healthcheck:
      test: ["CMD", "curl", "-k", "-f", "https://localhost:8001/api/v1/cloud/health"]
      interval: 5s
      timeout: 3s
      retries: 5
    volumes:
      - cloud-data:/app/qeris/s2

  qeris-gateway:
    build: .
    container_name: qeris-gateway
    command: python qeris/s2/gateway.py
    ports:
      - "8000:8000"
    environment:
      - QERIS_GATEWAY_HOST=0.0.0.0
      - QERIS_GATEWAY_PORT=8000
      - QERIS_CLOUD_URL=https://qeris-cloud:8001
      - QERIS_CLOUD_CA_CERT=/app/qeris/s2/certs/cloud_cert.pem
      - QERIS_ADMIN_API_KEY=${QERIS_ADMIN_API_KEY}
    depends_on:
      qeris-cloud:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 5s
      timeout: 3s
      retries: 5
    volumes:
      - gateway-data:/app/qeris/s2

volumes:
  cloud-data:
  gateway-data:
